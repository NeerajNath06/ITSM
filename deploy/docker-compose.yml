# Local development dependencies — self-hosted OSS stack per
# docs/adr/ADR-022-oss-self-hosted-infrastructure-stack.md.
# Not a production deployment (see
# docs/infrastructure/self-hosted-production-architecture.md for that).
#
# Usage: docker compose -f deploy/docker-compose.yml up -d

name: itsm-dev

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_dev_only
      POSTGRES_DB: itsm
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: itsm
      RABBITMQ_DEFAULT_PASS: itsm_dev_only
    ports:
      - "15672:5672"
      - "25672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: itsm
      MINIO_ROOT_PASSWORD: itsm_dev_only
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_only
      KC_DB: dev-file
    ports:
      - "18080:8080"

  openbao:
    image: openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: itsm_dev_only
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "18200:8200"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11025:1025"
      - "18025:8025"

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: itsm
      POSTGRES_PWD: itsm_dev_only
      POSTGRES_SEEDS: postgres
    ports:
      - "17233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "18088:8080"
    depends_on:
      - temporal

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  opensearch-data: