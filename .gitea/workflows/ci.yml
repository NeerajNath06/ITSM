# CI pipeline per docs/devops/cicd.md. Gitea-Actions syntax (GitHub Actions
# compatible) — final CI runner choice (Jenkins vs. Gitea Actions) is an
# open follow-up per docs/adr/ADR-022-oss-self-hosted-infrastructure-stack.md;
# this file works unmodified on either a Gitea Actions runner or GitHub
# Actions if that pick changes.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore ITSM.slnx
      - name: Build
        run: dotnet build ITSM.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test ITSM.slnx --no-build --configuration Release --logger "trx"

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - name: Install
        run: npm ci
      - name: Build design-system
        run: npm run build --workspace=@itsm/design-system
      - name: Build apps
        run: |
          npm run build --workspace=@itsm/employee-portal
          npm run build --workspace=@itsm/agent-workspace
          npm run build --workspace=@itsm/admin-console
      - name: Lint
        run: |
          npm run lint --workspace=@itsm/design-system
          npm run lint --workspace=@itsm/employee-portal
          npm run lint --workspace=@itsm/agent-workspace
          npm run lint --workspace=@itsm/admin-console

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret scan (gitleaks-class), scanning git history (not the raw
      # working tree, which would flag gitignored/generated noise) via the
      # official image directly rather than a marketplace action, so this
      # step works unmodified on Gitea Actions or GitHub Actions.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact -v

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: NuGet dependency vulnerability scan
        run: |
          dotnet restore ITSM.slnx
          dotnet list ITSM.slnx package --vulnerable --include-transitive | tee nuget-vuln.log
          ! grep -Eqi "Critical|High" nuget-vuln.log

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - name: npm dependency vulnerability scan
        working-directory: apps
        run: |
          npm ci
          npm audit --audit-level=high

      - name: SAST (semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --error --severity=ERROR \
            --config=p/security-audit --config=p/secrets \
            --config=p/csharp --config=p/typescript \
            --exclude=apps/node_modules .

  infra-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/iac
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.7.*"
      - name: Format check
        run: tofu fmt -check -recursive
      - name: Init (no backend, validate only)
        run: tofu init -backend=false
      - name: Validate
        run: tofu validate
